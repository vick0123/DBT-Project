version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application database.
    tables:
      - name: customer_information
      - name: customers
        description: Raw customers data.
        columns:
          - name: id
            description: Primary key for the customer data
            data_tests:
              - unique
              - not_null
      - name: customers02
      - name: items
      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            description: Primary key for the orders data.
            data_tests:
              - unique
              - not_null
      - name: orders02
      - name: orders_01
      - name: products
      - name: stores
      - name: supplies